name: presenter-talk
# Invented AI presenter (not Nathan, not any real person) talking to camera, cut with real screen recordings
# of the demo. Manual start only. Resumable: every finished step is committed under assets/presenter/<job>/,
# so when the free ZeroGPU quota runs out, dispatch again with the same job name and it continues.
# Never posts anything. Whoever uploads must switch on Meta's "AI info" label (realistic AI video).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'faces = make presenter candidates, render = make a video'
        required: false
        default: 'render'
      job:
        description: 'Job name (folder under assets/presenter/jobs). Empty = newest unfinished or new dated job'
        required: false
        default: ''
      script:
        description: 'JSON list of spoken lines. Empty = default test script'
        required: false
        default: ''
      presenter:
        description: 'A, B or C (assets/presenter/presenter_<X>.png)'
        required: false
        default: 'A'
      model:
        description: 'wan_s2v (free, no GPU quota) or longcat (ZeroGPU, more motion)'
        required: false
        default: 'wan_s2v'
      voice:
        description: 'Gemini voice name (empty = matches presenter)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: presenter-talk
  cancel-in-progress: false
jobs:
  talk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter fonts-dejavu-core
      - run: pip install gradio_client pillow kokoro-onnx soundfile faster-whisper playwright numpy
      - if: inputs.mode == 'render'
        run: python -m playwright install --with-deps chromium
      - if: inputs.mode == 'faces'
        run: python presenter_faces.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE: ${{ inputs.job == 'force' && '1' || '' }}
      - if: inputs.mode == 'render'
        run: python presenter_talk.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          JOB: ${{ inputs.job }}
          SCRIPT: ${{ inputs.script }}
          PRESENTER: ${{ inputs.presenter }}
          MODEL: ${{ inputs.model }}
          VOICE: ${{ inputs.voice }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presenter-${{ github.run_id }}
          path: assets/presenter/
          if-no-files-found: ignore
      - name: commit progress
        if: always()
        run: |
          git config user.name tcg
          git config user.email tcg@users.noreply.github.com
          git add assets/presenter
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -qm "presenter progress $(date -u +%F)"
          git pull -q --rebase
          git push
