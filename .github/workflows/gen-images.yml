name: gen-images
on:
  workflow_dispatch:
    inputs:
      test_items:
        default: ''
  schedule:
    - cron: '20 6 * * *'
permissions:
  contents: write
  actions: read
jobs:
  gate:
    # GitHub cron fires hours late, so n8n dispatches this at a fixed Amsterdam time.
    # The cron is only a backup: it skips if a dispatched run already succeeded today.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/gen-images.yml/runs?event=workflow_dispatch&status=success&created=%3E%3D$(date -u +%F)" --jq '.total_count')
          if [ "$n" -gt 0 ]; then echo "already ran today via dispatch ($n), skipping backup cron"; echo "go=0" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
  gen:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-inter || true
      - run: pip install gradio_client pillow
      - run: python gen_images.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST_ITEMS: ${{ inputs.test_items }}
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ github.run_id }}
          path: assets/gen/
          if-no-files-found: ignore
      - name: commit images
        if: ${{ inputs.test_items == '' }}
        run: |
          git config user.name tcg
          git config user.email tcg@users.noreply.github.com
          git add -A assets/gen
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -qm "images $(date -u +%F)"
          git pull -q --rebase
          git push
