name: product-factory
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'how many products'
        default: '1'
      niche:
        description: 'A=real estate kits, B=AI/business toolkits, C=planners, empty=rotate'
        default: ''
      dry_run:
        description: 'build only, do not publish'
        type: boolean
        default: false
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: write
  actions: read
jobs:
  gate:
    # GitHub cron fires hours late, so n8n dispatches this at a fixed Amsterdam time.
    # The cron is only a backup: it skips if a dispatched run already succeeded today.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/products.yml/runs?event=workflow_dispatch&status=success&created=%3E%3D$(date -u +%F)" --jq '.total_count')
          if [ "$n" -gt 0 ]; then echo "already ran today via dispatch ($n), skipping backup cron"; echo "go=0" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
  make:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-inter fonts-dejavu-core
      - run: pip install reportlab openpyxl pillow
      - run: python product_factory.py
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          COUNT: ${{ inputs.count || '2' }}
          NICHE: ${{ inputs.niche }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: products-${{ github.run_id }}
          path: pout/
          if-no-files-found: ignore
