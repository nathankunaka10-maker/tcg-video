name: product-factory
on:
  workflow_dispatch:
    inputs:
      count: {description: 'how many products', default: '1'}
      niche: {description: 'A=real estate kits, B=AI/business toolkits, C=planners, empty=rotate', default: ''}
      dry_run: {description: 'build only, do not publish', type: boolean, default: false}
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-inter fonts-dejavu-core
      - run: pip install reportlab openpyxl pillow
      - run: python product_factory.py
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          COUNT: ${{ inputs.count || '2' }}
          NICHE: ${{ inputs.niche }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: products-${{ github.run_id }}, path: pout/, if-no-files-found: ignore}
