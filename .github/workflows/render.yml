name: render-video
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'ad, daily, or empty for auto (Tue/Fri = ad)'
        required: false
        default: ''
      publish:
        description: 'Push to the video branch (posts automatically). Off = test render only, download from artifacts'
        type: boolean
        default: true
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python render.py
        env:
          MODE: ${{ inputs.mode }}
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
      - name: publish
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [ ! -f out/latest.mp4 ]; then echo "nothing to publish"; exit 0; fi
          cd out
          git init -q
          git checkout -q -b video
          git config user.name tcg
          git config user.email tcg@users.noreply.github.com
          git add .
          git commit -qm "video $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video
