name: pod-designs
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'how many designs'
        default: '10'
      dry_run:
        description: 'render only, do not push'
        type: boolean
        default: false
  schedule:
    - cron: '47 10 * * 1,4'
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-inter fonts-dejavu-core fonts-liberation
      - run: pip install pillow
      - run: python pod_factory.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COUNT: ${{ inputs.count || '10' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pod-${{ github.run_id }}
          path: pod_out/
          if-no-files-found: ignore
