<!doctype html><html><head><meta charset="utf-8"><style>
:root{--cyan:#06b6d4;--cy2:#22d3ee;--mut:#9ca3af;--line:#374151}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#0b1220;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden;position:relative}
#glow{position:absolute;width:1300px;height:1300px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,.42),rgba(6,182,212,0) 62%);left:-110px;top:300px}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(55,65,81,.28) 2px,transparent 2px),linear-gradient(90deg,rgba(55,65,81,.28) 2px,transparent 2px);background-size:90px 90px;opacity:.6}
.scene{position:absolute;inset:0;padding:170px 80px;display:flex;flex-direction:column;justify-content:center;opacity:0}
.big{font-size:104px;line-height:1.06;font-weight:800;letter-spacing:-.03em}
.cy{color:var(--cy2)}
.lab{font-size:30px;letter-spacing:.16em;font-weight:700;color:var(--cyan);margin-bottom:34px}
.card{background:#1f2937;border:2px solid var(--line);padding:56px 54px;font-size:62px;line-height:1.22;font-weight:700;box-shadow:0 0 90px rgba(6,182,212,.25)}
.num{font-size:150px;font-weight:800;color:var(--cy2);line-height:1;margin-bottom:26px}
.tile{padding:38px 50px;margin:24px 0;display:flex;justify-content:space-between;align-items:center;background:#1f2937;border:2px solid var(--line)}
.tile .l{font-size:48px;color:var(--mut);font-weight:600}.tile .v{font-size:120px;font-weight:800}
.btn{display:inline-block;background:var(--cyan);color:#fff;font-weight:800;padding:38px 64px;font-size:50px}
.wm{position:absolute;left:80px;bottom:80px;font-size:34px;font-weight:700;color:var(--mut)}.wm b{color:var(--cyan)}
.line{position:absolute;left:0;top:0;height:10px;background:var(--cyan)}
</style></head><body>
<div id="grid"></div><div id="glow"></div><div class="line" id="pb"></div>
<div id="scenes"></div>
<div class="wm">the<b>copygrind3r</b></div>
<script>
const E=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3),R=(t,a,b)=>Math.min(Math.max((t-a)/(b-a),0),1);
let D,durs,T,starts=[],els=[];
function fit(el,max,min,box){let s=max;el.style.fontSize=s+'px';while(el.scrollHeight>box&&s>min){s-=4;el.style.fontSize=s+'px'}}
window.setData=o=>{D=o.d;durs=o.durs;T=o.T;let a=0;durs.forEach(x=>{starts.push(a);a+=x});
 const wrap=document.getElementById('scenes');const S=[];
 S.push('<div class="big" id="hk">'+D.hook.replace(/(\d+[\d,.%]*)/g,'<span class="cy">$1</span>')+'</div>');
 D.points.forEach((p,i)=>S.push('<div class="lab">'+(i+1)+' / '+D.points.length+'</div><div class="card" id="pt'+i+'">'+p+'</div>'));
 S.push('<div class="lab">REAL NUMBERS FROM OUR OWN PIPELINE</div><div class="tile"><span class="l">Leads found</span><span class="v" id="v1">0</span></div><div class="tile"><span class="l">Emails sent</span><span class="v" id="v2">0</span></div><div class="tile" style="border-color:var(--cyan)"><span class="l">Replies</span><span class="v cy" id="v3">0</span></div>');
 S.push('<div class="big" style="font-size:104px">'+D.cta+'</div><div style="margin-top:70px"><span class="btn">thecopygrind3r.pages.dev</span></div>');
 wrap.innerHTML=S.map((h,i)=>'<div class="scene" id="sc'+i+'">'+h+'</div>').join('');
 S.forEach((_,i)=>els.push(document.getElementById('sc'+i)));
 fit(document.getElementById('hk'),132,64,1500);
 D.points.forEach((_,i)=>fit(document.getElementById('pt'+i),62,34,900));
};
window.setT=t=>{
 const g=document.getElementById('glow');g.style.left=(-110+Math.sin(t*.5)*140)+'px';g.style.top=(300+Math.cos(t*.4)*160)+'px';g.style.opacity=.75+.25*Math.sin(t*2);
 document.getElementById('grid').style.transform='translateY('+((t*40)%90)+'px)';
 els.forEach((e,i)=>{const a=starts[i],b=a+durs[i];const on=t>=a&&t<b+.15;const k=E(R(t,a,a+.35));e.style.opacity=on?Math.min(k,1-R(t,b-.15,b+.15)):0;e.style.transform='translateY('+((1-k)*60)+'px) scale('+(.97+.03*k)+')'});
 const si=els.length-2;const st=starts[si];[['v1','leads',0],['v2','sent',.4],['v3','replies',.8]].forEach(([id,k,dl])=>{const p=E(R(t,st+.3+dl,st+1.6+dl));document.getElementById(id).textContent=Math.round((D.stats[k]||0)*p)});
 document.getElementById('pb').style.width=(100*t/T)+'%';
};
</script></body></html>
